      <stop offset="0%" stop-color="#061a14" />
      <stop offset="100%" stop-color="#0d2e23" />
    </linearGradient>
    <linearGradient id="accentAgri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgAgri)"/>

  <!-- Window Header -->
  <rect x="25" y="25" width="550" height="38" rx="8" fill="#132e25"/>
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#eab308"/>
  <circle cx="79" cy="44" r="5" fill="#22c55e"/>
