  <rect x="50" y="125" width="230" height="36" rx="8" fill="#1b4332"/>
  <text x="62" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ecfdf5">"Best pest control for paddy blast?"</text>

