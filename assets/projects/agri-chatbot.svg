  <text x="82" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#d1fae5">Apply Tricyclazole 75% WP @ 0.6g/L.</text>
  <text x="82" y="224" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">🔊 Audio voice synthesized via gTTS</text>

  <!-- Audio Waveform Graphic -->
  <rect x="50" y="246" width="250" height="60" rx="8" fill="#042f2e"/>
  <path d="M 65 276 L 75 264 L 85 288 L 95 260 L 105 292 L 115 265 L 125 285 L 135 255 L 145 295 L 155 268 L 165 280 L 175 270 L 185 285 L 195 262 L 205 282 L 215 272 L 225 280 L 235 273 L 285 273" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="65" y="297" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5eead4">gTTS Speech Synthesizer Output: 24kHz</text>

  <!-- Right: Architecture Stack Card -->
  <rect x="330" y="78" width="235" height="245" rx="10" fill="#081c15" stroke="#1b4332" stroke-width="1.5"/>
  <text x="345" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#6ee7b7">MODULAR BACKEND</text>

  <rect x="345" y="125" width="205" height="40" rx="6" fill="#143e30"/>
  <text x="355" y="145" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34d399">Flask REST API Router</text>
  <text x="355" y="158" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">POST /api/v1/query/agri</text>

  <rect x="345" y="175" width="205" height="40" rx="6" fill="#143e30"/>
  <text x="355" y="195" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#38bdf8">NLP Intent &amp; Entity Extractor</text>
  <text x="355" y="208" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#93c5fd">Cosine similarity &amp; Tokenizer</text>

  <rect x="345" y="225" width="205" height="40" rx="6" fill="#143e30"/>
  <text x="355" y="245" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#f43f5e">gTTS Voice Engine</text>
  <text x="355" y="258" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fecdd3">Realtime Audio Stream</text>

  <rect x="345" y="275" width="205" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="355" y="297" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6ee7b7">⚡ Sub-second response</text>
