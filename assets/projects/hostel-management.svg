<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHostel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#11294a" />
    </linearGradient>
    <linearGradient id="accentAndroid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgHostel)"/>

  <!-- Window Header -->
  <rect x="25" y="25" width="550" height="38" rx="8" fill="#173155"/>
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#eab308"/>
  <circle cx="79" cy="44" r="5" fill="#22c55e"/>
  <text x="110" y="49" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7dd3fc">android-hostel-admin // Kotlin &amp; Room Architecture</text>

  <!-- Left: Mobile Device Frame Preview -->
  <rect x="55" y="75" width="160" height="255" rx="20" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
  <!-- Phone speaker & camera notch -->
  <rect x="105" y="83" width="60" height="5" rx="2.5" fill="#334155"/>
  
  <!-- App Screen -->
  <rect x="65" y="96" width="140" height="220" rx="12" fill="#0f172a"/>
  <!-- App Header -->
  <rect x="65" y="96" width="140" height="30" fill="#0284c7"/>
  <text x="75" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Hostel Dashboard</text>

  <!-- App Card 1: Room Allocation -->
  <rect x="72" y="134" width="126" height="36" rx="6" fill="#1e293b"/>
  <text x="78" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8">Room #304 (Deluxe)</text>
  <text x="78" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">Allocated: 2/2 Students</text>

  <!-- App Card 2: Complaint Ticket -->
  <rect x="72" y="176" width="126" height="36" rx="6" fill="#1e293b"/>
  <text x="78" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#f59e0b">Complaint #892</text>
  <text x="78" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#22c55e">Status: Resolved</text>

  <!-- App Card 3: Student Registry -->
  <rect x="72" y="218" width="126" height="36" rx="6" fill="#1e293b"/>
  <text x="78" y="232" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="bold" fill="#3ddc84">Student Registry</text>
  <text x="78" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">Records: 450 Verified</text>

  <!-- Phone Nav bar -->
  <circle cx="135" cy="300" r="6" fill="#334155"/>

  <!-- Right: Architecture & Features -->
  <rect x="245" y="78" width="320" height="245" rx="10" fill="#07152b" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="265" y="105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#3ddc84">ANDROID SYSTEM DESIGN</text>

  <rect x="265" y="122" width="280" height="42" rx="6" fill="#0f2747"/>
  <text x="278" y="140" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#7dd3fc">Structured Entity Data Models</text>
  <text x="278" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Student, Room, Allocations, Incident Logs</text>

  <rect x="265" y="172" width="280" height="42" rx="6" fill="#0f2747"/>
  <text x="278" y="190" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#3ddc84">Streamlined Daily Administration</text>
  <text x="278" y="204" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Instant check-ins, key tracking, fee validation</text>

  <rect x="265" y="222" width="280" height="42" rx="6" fill="#0f2747"/>
  <text x="278" y="240" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#f43f5e">Complaint Lifecycles</text>
  <text x="278" y="254" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Open -&gt; Under Review -&gt; Resolved flow</text>

  <rect x="265" y="274" width="280" height="35" rx="6" fill="#042f2e" stroke="#3ddc84" stroke-width="1"/>
  <text x="278" y="296" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#86efac">Android Studio · Kotlin · MVVM UI/UX</text>
</svg>
