<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTextile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="primaryTextile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgTextile)"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 0 60 L 600 60 M 0 120 L 600 120 M 0 180 L 600 180 M 0 240 L 600 240 M 0 300 L 600 300" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
  <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360" stroke="#1e293b" stroke-width="1" opacity="0.4"/>

  <!-- Window Header -->
  <rect x="25" y="25" width="550" height="38" rx="8" fill="#1e293b"/>
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#eab308"/>
  <circle cx="79" cy="44" r="5" fill="#22c55e"/>
  <text x="110" y="49" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">textile-store-db // normalized_schema.sql</text>

  <!-- Left Panel: Relational DB Schema / Tables -->
  <rect x="35" y="78" width="240" height="245" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M 35 110 L 275 110" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38bdf8">TABLE: INVENTORY_STOCK</text>
  <text x="50" y="132" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">PK item_id INT (1NF/3NF)</text>
  <text x="50" y="156" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">FK category_id INT</text>
  <text x="50" y="180" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">   stock_quantity INT</text>
  <text x="50" y="204" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">   unit_price DECIMAL(10,2)</text>
  <text x="50" y="228" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">   sync_status 'ACTIVE'</text>
  
  <rect x="50" y="252" width="210" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="60" y="272" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a5b4fc">QUERY LATENCY: 2.4ms</text>
  <text x="60" y="292" font-family="'JetBrains Mono', monospace" font-size="10" fill="#67e8f9">CRUD INVENTORY ENGINE</text>

  <!-- Right Panel: POS Billing & Realtime Metrics -->
  <rect x="295" y="78" width="270" height="245" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M 295 110 L 565 110" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34d399">REALTIME BILLING MODULE</text>
  
  <!-- Mini Chart / Stock Bar Indicators -->
  <text x="310" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Cotton Fabrics Stock</text>
  <rect x="310" y="145" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="310" y="145" width="190" height="8" rx="4" fill="url(#primaryTextile)"/>

  <text x="310" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Silk Inventory Turnover</text>
  <rect x="310" y="185" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="310" y="185" width="220" height="8" rx="4" fill="#10b981"/>

  <text x="310" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Cash/Invoice Generation</text>
  <rect x="310" y="225" width="240" height="8" rx="4" fill="#334155"/>
  <rect x="310" y="225" width="150" height="8" rx="4" fill="#8b5cf6"/>

  <!-- Badge at bottom right -->
  <rect x="310" y="260" width="240" height="45" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
  <text x="325" y="287" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#4ade80">✓ 100% Normalized 3NF DB</text>
</svg>
