<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <circle cx="200" cy="200" r="170" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Subtle tech grid rings -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#334155" stroke-dasharray="6,6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Stylish Developer Silhouette & Monogram -->
  <g transform="translate(200, 200)">
    <!-- Shield / Hexagon base -->
    <path d="M 0 -85 L 75 -42 L 75 42 L 0 85 L -75 42 L -75 -42 Z" fill="#1e1b4b" stroke="url(#avatarGrad)" stroke-width="3" opacity="0.9"/>
    
    <!-- Code Brackets & R Monogram -->
    <text x="0" y="24" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-size="76" font-weight="900" fill="url(#ringGrad)" text-anchor="middle" letter-spacing="-2">RS</text>
    
    <!-- Mini Terminal Accent -->
    <circle cx="-35" cy="-55" r="4" fill="#ef4444"/>
    <circle cx="-20" cy="-55" r="4" fill="#eab308"/>
    <circle cx="-5" cy="-55" r="4" fill="#22c55e"/>
  </g>

  <!-- Floating Tech Orbits -->
  <circle cx="95" cy="115" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="95" y="119" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>

  <circle cx="310" cy="120" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="310" y="124" font-family="monospace" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">AI</text>

  <circle cx="305" cy="285" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="305" y="289" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">SQL</text>

  <circle cx="95" cy="285" r="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="95" y="289" font-family="monospace" font-size="10" font-weight="bold" fill="#f472b6" text-anchor="middle">SEC</text>
</svg>
